# Additional jpackage launcher "MRemora Viewer" (used by scripts/build-app-image.sh).
# @VIEWER_JAR@ is replaced at build time with the viewer jar file name from mremora-dist/target/app.
main-jar=@VIEWER_JAR@
main-class=pl.mtech.mremora.viewer.ViewerMain
description=MRemora Viewer
java-options=--enable-native-access=ALL-UNNAMED
win-shortcut=true
win-menu=true
linux-shortcut=true
