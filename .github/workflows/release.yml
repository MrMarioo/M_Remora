name: Release

# Merge into main (staging -> main PR): builds MRemora-setup-<version>.exe (Windows) and
# mremora_<app-version>_amd64.deb (Linux) and publishes both as a GitHub Release.
# Manual run (workflow_dispatch) on any branch: builds both as CI artifacts only, no release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        # Installer/tag: YYYY.MM.DD.<run number>; jpackage: 0.1.<run number> (Windows accepts only x.y.z).
        run: |
          VERSION="$(TZ=Europe/Warsaw date +%Y.%m.%d).$RUN_NUMBER"
          APP_VERSION="0.1.$RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, app version: $APP_VERSION"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build app-image
        run: bash scripts/build-app-image.sh "$APP_VERSION"
      - name: Smoke test app-image
        run: bash scripts/smoke-app-image.sh
      # Separate step: a directory appended to GITHUB_PATH is only visible from the next step on.
      - name: Ensure NSIS
        # GITHUB_PATH takes Windows paths (C:\...), not Git Bash ones (/c/...).
        run: |
          if ! command -v makensis > /dev/null 2>&1; then
            NSIS_DIR="/c/Program Files (x86)/NSIS"
            if [ ! -x "$NSIS_DIR/makensis.exe" ]; then
              choco install nsis -y --no-progress
            fi
            "$NSIS_DIR/makensis.exe" -VERSION
            cygpath -w "$NSIS_DIR" >> "$GITHUB_PATH"
          fi
      - name: Build installer
        run: bash scripts/build-installer.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MRemora-setup-${{ needs.version.outputs.version }}
          path: dist/MRemora-setup-*.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fakeroot
      - name: Build app-image
        run: bash scripts/build-app-image.sh "$APP_VERSION"
      - name: Smoke test app-image
        run: bash scripts/smoke-app-image.sh
      - name: Build .deb
        run: bash scripts/build-deb.sh "$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: mremora-deb-${{ needs.version.outputs.app_version }}
          path: dist/mremora_*.deb
          if-no-files-found: error

  release:
    needs: [version, windows, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MRemora ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/MRemora-setup-*.exe
            dist/mremora_*.deb
          fail_on_unmatched_files: true
